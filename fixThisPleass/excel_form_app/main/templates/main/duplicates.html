<h2>Resolve Duplicates</h2>

{% if duplicates %}
    {% for d in duplicates %}
        <div style="border:1px solid red; padding:10px; margin-bottom:10px;">
            <p><strong>Excel row:</strong> {{ d.row }}</p>
            <p><strong>Αριθμός Εισαγωγής:</strong> {{ d.ari8mos }}</p>

            <form method="post" action="{% url 'handle_duplicate' %}">
                {% csrf_token %}
                <input type="hidden" name="index" value="{{ forloop.counter0 }}">

                <button type="submit" name="action" value="edit">
                    Edit existing
                </button>

                <button type="submit" name="action" value="skip">
                    Skip
                </button>
            </form>
        </div>
    {% endfor %}
{% else %}
    <p>No duplicates left 🎉</p>
{% endif %}

<br>
<a href="{% url 'upload_excel' %}">
    <button>Back to upload</button>
</a>
